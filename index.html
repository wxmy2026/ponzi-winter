<style>
[hidden]{display:none!important}
/* Layout: a storybook — each moment is one illustrated plate; the words sit on a dark card tucked over its bottom edge, like the Apple Arcade banners */
:root{
  --paper:#f3ead9; --card:#fffaf1; --ink:#3b2a1e; --muted:#8a7562; --line:#e6d7bf; --lift:#e2d2b6;
  --tomato:#d9583b; --tomatoD:#b6432a; --leaf:#4f9a4a; --mustard:#f0b63a; --navy:#34436e; --cocoa:rgba(59,42,30,.92);
  --ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --num:"Nunito","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
h1{font-weight:900;font-size:30px;line-height:1.2;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-weight:900;font-size:23px;line-height:1.4;margin:0;text-wrap:balance}
h3{font-weight:900;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}

.hright{display:flex;align-items:center;gap:10px}
.mbtn{all:unset;cursor:pointer;font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--lift)}
.mbtn[aria-pressed="true"]{background:var(--leaf);color:#fff;box-shadow:0 2px 0 #3b7a3a}
.mbtn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date{background:var(--mustard);color:var(--ink);font-weight:900;font-size:12px;padding:4px 12px;border-radius:999px}
.chips{display:contents}
.chip{background:var(--card);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:0 2px 0 var(--lift)}
.chip b{font-family:var(--num);font-weight:900;font-size:14px;color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}

#sc{display:block;width:100%;aspect-ratio:16/9;max-width:100%;touch-action:manipulation}

.scene{display:flex;flex-direction:column;gap:12px}
#stage::after{content:"";display:block;height:60vh;pointer-events:none}
.dialog{position:relative;z-index:1;margin:-58px 12px 0;background:var(--cocoa);color:#fbf3e4;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(59,42,30,.18)}
.dialog h2{color:#fff}
.dialog .narr,.dialog .muted{color:#dcc7a6;font-size:14px}
.dialog .who{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--mustard)}
.dialog .line{font-size:19px;font-weight:700;line-height:1.6;color:#fff}
.dialog .cue{font-size:14px;color:#dcc7a6}
.dialog .react{font-size:17px;color:#fff}
.dialog .you{border-left:3px solid var(--mustard);padding-left:12px;color:#fff}
.speech{display:flex;flex-direction:column;gap:4px}
.narr{color:var(--muted)}
.you{border-left:3px solid var(--mustard);padding-left:12px}
.delta{align-self:flex-start;font-family:var(--num);font-weight:900;font-size:13px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.delta.up{background:#e0583b} .delta.down{background:#4f9a4a}

.gauge{display:flex;flex-direction:column;gap:7px;padding-top:4px;border-top:1px solid rgba(255,255,255,.12);margin-top:2px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.12em;color:#dcc7a6}
.sus-num{font-family:var(--num);font-weight:900;font-size:16px;color:#fff;letter-spacing:0}
.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;transition:width .5s ease,background .5s ease}
.ladder{display:flex;flex-wrap:wrap;gap:5px}
.rung{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:#cbb593}
.rung.on{background:var(--mustard);color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:10px}

.opt:hover{transform:translateY(-2px);border-color:var(--mustard)}

.card .name{font-weight:900;font-size:18px}

.cards{display:flex;flex-direction:column;gap:10px}

.btn{all:unset;box-sizing:border-box;cursor:pointer;align-self:flex-start;padding:11px 26px;border-radius:999px;background:var(--tomato);color:#fff;font-weight:900;font-size:14px;letter-spacing:.12em;box-shadow:0 4px 0 var(--tomatoD);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tomatoD)}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

.row{display:flex;gap:12px;flex-wrap:wrap}
.opt.picked{border-color:var(--leaf);background:#eef6e9}
.notif{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.nbody{pointer-events:auto;max-width:560px;width:100%;background:#3b2a1e;color:#fbf3e4;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 0 rgba(59,42,30,.25);animation:drop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.ntag{align-self:flex-start;font-size:11px;font-weight:900;letter-spacing:.1em;background:var(--tomato);color:#fff;padding:2px 10px;border-radius:999px}
.nline{font-size:17px;font-weight:700;color:#fff}
.nbody .muted{color:#dcc7a6}
.nopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nopt{padding:10px 12px;gap:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:29;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:16px;box-shadow:0 6px 0 rgba(59,42,30,.25)}

.vcard h3{color:var(--ink)}.vcard .probed{color:var(--leaf);font-weight:700}
.chip.modern b{color:var(--leaf)}

.plate.bump{animation:bump .14s ease-out}

@keyframes stampin{0%{transform:scale(1.25) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.opt:active,.btn:active{transform:translateY(3px) scale(.985)}
@media (prefers-reduced-motion:reduce){.plate.bump,.plate.bumpH,.chip b.pop,.stampin{animation:none}}
.lchip{all:unset;cursor:pointer;background:var(--card);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:0 2px 0 var(--lift)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(59,42,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:22px;max-width:600px;width:100%;max-height:80vh;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(59,42,30,.25)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lierow{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:var(--paper)}
.lierow.burst{background:#fbe1d8}
.lierow.burst b{text-decoration:line-through;color:var(--tomatoD)}
.rbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}.rbar i{display:block;height:100%;border-radius:999px}
.timer{height:10px;border-radius:999px;background:var(--line);overflow:hidden}.timer i{display:block;height:100%;width:100%;border-radius:999px;background:var(--mustard);transition:width .1s linear}
.endings .rung{background:var(--paper);color:var(--muted)}.endings .rung.on{background:var(--mustard);color:var(--ink)}

.flag{font-size:14px;padding:10px 14px;border-radius:16px;background:#fbe1d8;color:#8a3420}
.flag.gold{background:#fdefc8;color:#7a5410}
.flag.note{background:#e3efdc;color:#2f5e2c}

.ledger{background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--lift);padding:14px 16px;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.ledger .v{font-family:var(--num);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}

.ledger .note{grid-column:1/-1;color:var(--muted);font-size:12px}

.beat{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 0}
.heart{width:56px;height:56px;border-radius:50%;background:var(--tomato);animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.85);opacity:.6}15%{transform:scale(1.05);opacity:1}30%{transform:scale(.9)}45%{transform:scale(1)}}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--lift);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.stat .n{font-family:var(--num);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums;color:var(--tomato)}
.stat .h{font-size:12px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:20px;box-shadow:0 4px 0 var(--lift);padding:16px}
.replay{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.replay li{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:2px dashed var(--line)}
.replay li:last-child{border-bottom:0;padding-bottom:0}
.replay .said{font-size:13px;color:var(--muted)}
.replay .thought{font-size:16px;font-weight:700}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{padding:10px 12px;border-radius:14px;background:var(--paper)}
.lesson b{color:var(--tomato);font-weight:900}
.facts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.lieslist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--tomatoD)}
.src{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.src a{color:var(--leaf)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.heart{animation:none}.meter i{transition:none}}
@media (max-width:420px){h1{font-size:24px}.dialog{margin:-40px 8px 0;padding:14px}.dialog .line{font-size:17px}.stat .n{font-size:20px}}
.tutbars{display:grid;gap:8px;margin:14px 0;padding:14px 16px;background:#fffaf0;border-radius:18px;box-shadow:0 3px 0 #e6d6bd}.tbrow{display:grid;grid-template-columns:5.5em 1fr 5em;align-items:center;gap:10px}.tbk{font-size:14px;color:#7a6650}.tbv{font-weight:800;text-align:right;font-family:Nunito,sans-serif}.tbbar{height:14px;background:#efe3cf;border-radius:8px;overflow:hidden}.tbbar i{display:block;height:100%;border-radius:8px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}

.a4go{border:3px solid #d9583b;border-radius:20px;padding:16px 18px;background:#fff4e8}.a4go .btn{margin-top:8px}.rung.burnt{text-decoration:line-through;opacity:.6}.flag.rule b{margin-right:4px}.reveal{border-left:4px solid #f0b63a;padding-left:14px}

    <h1>庞氏的冬天</h1>

 {who:"daniels",date:"1919年12月",goal:"让他愿意听你说下去",narr:"店里只剩你们两个人。煤油灯嗞嗞作响。",speaker:"丹尼尔斯",

/* the reel: only on closing moments. wait out the nibbles, strike on the real bite */
function reelScreen(st){
  const T=st.turn,o=T.opts[S.last],who=T.who,c=S.c[who];
  const tier=o.sus<=-5?2:o.sus>=15?0:1;
  const win=[430,650,900][tier];
  const fakes=Math.min(3,(tier===0?1:0)+Math.floor(c.sus/35)+(Math.random()<.5?1:0));
  stage.appendChild(el("span","goal","收网 · "+T.goal));
  stage.appendChild(el("p","you",o.text));
  stage.appendChild(el("p","narr",["这句话太冲。他会先试探好几下。","浮漂动了。他在犹豫。","这句话说到了他心坎上。他游过来了。"][tier]+"浮漂先会轻轻抖几下；等它整个沉下去、庞齐头上冒出「!」，马上点画面或「收线」。点早了会吓跑他。"));
  const b=btn("收线",()=>tap());b.classList.add("big");stage.appendChild(b);
  const rnd=(a,z)=>a+Math.random()*(z-a);
  const nib=[];let tc=rnd(1100,1700);for(let i=0;i<fakes;i++){nib.push(tc);tc+=rnd(700,1250);}
  const biteAt=tc+rnd(250,700);
  const fx0=.62+(1-Math.min(1,c.trust/60))*.28,fxHook=.66;
  const live={fish:{x:fx0,y:.8,name:CH[who].name},tension:c.sus/100,lineColor:c.sus<40?"#fbf6ec":c.sus<75?"#f0b63a":"#e0583b",rings:[]};
  SC.set({kind:"lake",live});SC.onTap(()=>tap());
  let phase="wait",biteT=0,res=null,resT=0;const t0=performance.now();let rings=[];
  function tap(){if(phase==="done")return;const n=performance.now();if(phase==="wait")finish("eager");else finish(n-biteT<win*.5?"perfect":"good");}
  function finish(r){phase="done";res=r;resT=performance.now();b.disabled=true;SC.onTap(null);
    b.textContent={perfect:"稳稳收线",good:"收住了",eager:"太急了",late:"他吐钩了"}[r];
    rings.push({t:resT,c:r==="perfect"||r==="good"?"rgba(240,182,58,A)":"rgba(217,88,59,A)"});
    document.removeEventListener("keydown",kd);
    const pAt=S.p;setTimeout(()=>{if(S.p===pAt&&S.ph==="reel")applyReel(who,r);},REDUCE?350:1000);}
  function kd(e){if(e.code==="Space"||e.key===" "||e.key==="Enter"){e.preventDefault();tap();}}
  document.addEventListener("keydown",kd);
  function frame(n){
    if(S.ph!=="reel"&&phase!=="done")return;
    const e=n-t0,t=REDUCE?0:n/1000;
    if(phase==="wait"&&e>=biteAt){phase="bite";biteT=n;MUSIC.sfx("plunk");rings.push({t:n,c:"rgba(255,255,255,A)"});}
    if(phase==="bite"&&n-biteT>win)finish("late");
    const app=Math.min(1,e/1000),ease=1-Math.pow(1-app,3);
    let fxp=fx0+(fxHook-fx0)*ease,flip=false,fast=false,bob=Math.sin(t*2)*1.2,lean=0,exclaim=0,spark=0,drops=0,a=.9;
    nib.forEach(nt=>{const p=(e-nt)/260;if(p>0&&p<1)bob+=7*Math.sin(Math.PI*p);if(e-nt>0&&e-nt<40&&!rings.some(r=>Math.abs(r.t-(t0+nt))<60))rings.push({t:t0+nt,c:"rgba(255,255,255,A)"});});
    if(phase==="bite"){bob=16+Math.sin(n/40)*1.5;exclaim=Math.min(1,(n-biteT)/90);fxp=fxHook-.015;}

      if(res==="perfect"||res==="good"){lean=Math.sin(Math.min(1,p*2)*Math.PI/2);bob=-8*(1-p);drops=Math.min(1,p*1.6);spark=res==="perfect"?p:0;fxp=fxHook-.012;}
      else{flip=true;fast=true;fxp=fxHook+p*.3;a=.9*(1-p*.6);bob=res==="late"?8*(1-p):bob;}}

    Object.assign(live,{fish:{x:fxp,y:.8+Math.sin(t*1.3)*.012,flip,fast,a,name:CH[who].name},bob,lean,exclaim,spark,drops,hop:exclaim?Math.sin(Math.min(1,(n-biteT)/180)*Math.PI):0,rings:rings.map(r=>({p:(n-r.t)/1100,c:r.c}))});
    if(phase!=="done"||n-resT<1100)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function weekCompute(w){
  const base=(2+S.m/15)*Math.sqrt(S.rate/10);
  const hf=1+S.heat/100, df=Math.max(.2,1-S.doubt/120);
  const n=Math.max(0,Math.round(base*hf*df*S.boost));
  const amt=n*[0,96,99,102][w], com=Math.round(amt*S.rate/100);
  S.investors+=n;S.invested+=amt;S.commission+=com;S.cash+=amt-com;spreadLies(1);
  if(n>0)S.batches.push({amt,due:w<=2?1:2});
  S.heat=Math.max(0,S.heat-3);
  return {n,amt,com};
}
